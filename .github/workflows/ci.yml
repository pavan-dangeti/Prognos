name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs: on a docs-and-code repo most pushes make the previous
# CI run irrelevant, and waiting for both wastes minutes for nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Check dependency lock is current
        run: uv lock --check

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy strict
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage gate
        # Core pipeline logic. The CLI is excluded because it is a thin argparse
        # wrapper; it is still tested, just not gated at the same level.
        run: >-
          uv run coverage report
          --include='src/prognos/convert.py,src/prognos/window.py,src/prognos/split.py,src/prognos/schema.py,src/prognos/config.py,src/prognos/metrics.py,src/prognos/evaluate.py,src/prognos/dataset.py,src/prognos/models.py,src/prognos/features.py,src/prognos/gbm.py,src/prognos/sequence.py'
          --fail-under=95

      - name: Coverage gate, streaming and decisions
        # Everything added after Phase 3: the stream services, the decision layer and
        # the benchmark. A separate gate so the data and model core keeps its higher bar.
        run: >-
          uv run coverage report
          --include='src/prognos/stream/*,src/prognos/decision.py,src/prognos/uncertainty.py,src/prognos/policy_eval.py,src/prognos/pipeline.py,src/prognos/bench.py'
          --fail-under=85

      - name: Smoke test on a synthetic subset
        # Proves the pipeline runs end to end in CI with no NASA data present.
        run: uv run pytest -m smoke -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  security:
    name: dependency and secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks uploads its findings as SARIF to code scanning, which needs write
      # access to security events. Scoped to this job rather than the whole
      # workflow so no other job can write to it.
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Export the resolved dependency set
        # pip-audit cannot read uv.lock, so the lockfile is exported to
        # requirements first. Auditing the export means auditing exactly what the
        # lockfile pins, not whatever a fresh resolve would pick.
        #
        # The `+cpu` build tag is stripped because it is a local version that only
        # exists on PyTorch's CPU index, which pip cannot resolve it from. It changes
        # the wheel build, not the version, so the advisory set is identical.
        run: |
          uv export --frozen --no-emit-project --all-groups --no-hashes -o requirements.txt
          sed -i 's/+cpu//g' requirements.txt

      - name: Audit Python dependencies
        # PYSEC-2025-194 and PYSEC-2026-139 are reviewed exceptions with stated
        # reasons and limits in pip-audit.toml. tests/test_security_policy.py fails if
        # this list and that file disagree, so an exception cannot be widened quietly.
        run: >-
          uv run pip-audit --strict -r requirements.txt
          --ignore-vuln PYSEC-2025-194
          --ignore-vuln PYSEC-2026-139

      - name: Scan git history for committed secrets
        # Run as a pinned binary rather than the action: the action tries to
        # upload SARIF to code scanning, which needs write access to security
        # events that a PR from this repository's default branch does not have.
        # The scan itself is what matters, and it needs no token at all.
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --verbose --exit-code 1

  smoke-docker:
    name: image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build the pipeline image
        run: docker build -f docker/Dockerfile --target runtime --tag prognos:ci .

      - name: Reclaim build cache before scanning
        # Trivy exports every layer to /tmp to analyse it, and on the runner that
        # runs out of disk while the build cache is still resident — the scan fails
        # with "no space left on device" rather than reporting a clean image.
        run: docker builder prune --all --force && docker image prune --force

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prognos:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Conversion smoke test inside the image
        run: |
          docker run --rm \
            -v "$PWD/configs:/app/configs:ro" \
            -v "$PWD/tests:/app/tests:ro" \
            -w /app \
            prognos:ci pytest -m smoke -q