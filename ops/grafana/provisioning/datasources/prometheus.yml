# Grafana reads a `datasources` list. An earlier version of this file carried a single
# `datasource` key with no URL, which Grafana ignores, leaving every panel without data.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prognos-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Jaeger
    type: jaeger
    uid: prognos-jaeger
    access: proxy
    url: http://jaeger:16686
