# Streaming stack.
#
# One image, six services. Six images would mean six builds and six vulnerability
# scans for the same code, and the components are the same package anyway.
#
# Local only by default: every port is bound to 127.0.0.1 on the host. Exposing this
# to a network is a deployment decision, not a default.

name: prognos-stream

services:
  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["prognos", "stream", "--config", "/app/configs/base.yaml"]
    environment:
      PROGNOS_SERVICE: ingestion
      PROGNOS_PORT: "8081"
      # Secrets come from the environment, never from a build argument. See
      # docs/design.md §11.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./configs:/app/configs:ro
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["prognos", "stream", "--config", "/app/configs/base.yaml"]
    environment:
      PROGNOS_SERVICE: inference
      PROGNOS_PORT: "8082"
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/readyz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["prognos", "stream", "--config", "/app/configs/base.yaml"]
    environment:
      PROGNOS_SERVICE: dashboard
      PROGNOS_PORT: "8083"
    ports:
      - "127.0.0.1:8083:8083"
    depends_on: [inference]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8083/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0@sha256:11c2e6c7993917ea89292b942e3428f73907b2809d554154bfb8b4ceb2301cc8
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-prognos-local-only}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

# Resource ceilings. The Always Free target is 2 OCPU / 12 GB, so the sum of these
# limits is the thing that has to fit. Set deliberately rather than inherited.
x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 1G
