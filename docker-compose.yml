# Streaming stack.
#
# One image, six services. Six images would mean six builds and six vulnerability
# scans for the same code, and the components are the same package anyway.
#
# Local only by default: every port is bound to 127.0.0.1 on the host. Exposing this
# to a network is a deployment decision, not a default.

name: prognos-stream

services:
  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    # --host 0.0.0.0 inside the container is required: a process bound to the
    # container's own loopback is unreachable through the published port. The security
    # boundary is the host-side mapping below, which stays on 127.0.0.1, so the port is
    # still not published off the machine. Two different boundaries, two settings.
    command: ["prognos", "serve", "--component", "ingestion", "--port", "8081", "--host", "0.0.0.0"]
    environment:
      PROGNOS_SERVICE: ingestion
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PROGNOS_PORT: "8081"
      PROGNOS_API_TOKEN: "${PROGNOS_API_TOKEN:-}"
      # Secrets come from the environment, never from a build argument. See
      # docs/design.md §11.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./configs:/app/configs:ro
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    # The rate limit is sized for the replay, the internal client this service exists
    # for, which asks for about a hundred predictions a second. At the default of 600 a
    # minute the stack's own replay was refused with 429 and every engine went
    # inference_unavailable. Abuse control for outside callers lives at the dashboard.
    # The raised limit applies to every caller, so it is safe only because this port is
    # published on loopback and needs PROGNOS_API_TOKEN when one is set. A deployment
    # that faces the internet must not publish it at all: inference stays on the
    # compose network, reachable by the replay alone.
    command: ["prognos", "serve", "--component", "inference", "--port", "8082", "--host", "0.0.0.0", "--model-dir", "/app/artifacts/model", "--rate-limit", "60000"]
    environment:
      PROGNOS_SERVICE: inference
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PROGNOS_PORT: "8082"
      PROGNOS_API_TOKEN: "${PROGNOS_API_TOKEN:-}"
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./configs:/app/configs:ro
      # The trained model plus its calibrator. Without this the service stays unready,
      # which is the correct behaviour: no calibrator means no interval, and an
      # interval-free prediction service is worse than one that refuses traffic.
      - ./artifacts:/app/artifacts:ro
    depends_on:
      ingestion:
        condition: service_healthy
    # Deliberately /healthz, not /readyz. Readiness returns 503 until a calibrated
    # model is mounted, and that is not a fault in the process: pointing the container
    # healthcheck at readiness would report the service unhealthy forever for a
    # condition that is fixed by supplying an artifact, not by restarting anything.
    # Readiness is what gates traffic, which is a different job.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  alerting:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["prognos", "serve", "--component", "alerting", "--port", "8083", "--host", "0.0.0.0"]
    environment:
      PROGNOS_SERVICE: alerting
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PROGNOS_PORT: "8083"
      PROGNOS_API_TOKEN: "${PROGNOS_API_TOKEN:-}"
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      # /healthz, not /readyz: readiness is authenticated once PROGNOS_API_TOKEN is
      # set, and the probe has no token, so it read 401 and marked a working service
      # unhealthy. Found by running the stack with auth on.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8083/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["prognos", "serve", "--component", "dashboard", "--port", "8084", "--host", "0.0.0.0"]
    environment:
      PROGNOS_SERVICE: dashboard
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PROGNOS_PORT: "8084"
      # Empty means authentication is off, which is only safe because every published
      # port below is bound to loopback. Set PROGNOS_API_TOKEN in .env before exposing
      # any of them; see docs/runbook.md.
      PROGNOS_API_TOKEN: "${PROGNOS_API_TOKEN:-}"
    ports:
      - "127.0.0.1:8084:8084"
    depends_on: [inference, alerting]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8084/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # The live system. Replays held-out engines at a watchable pace, predicts through
  # the inference service over HTTP (so a prediction is one trace across both), and
  # serves the fleet dashboard at /ui with live metrics for Prometheus. Without it the
  # stack had no data source: every other service waits to be called.
  replay:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command:
      - prognos
      - stream
      - --config
      - configs/base.yaml
      - --serve
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --pace
      - "10000"
      - --inference-url
      - http://inference:8082
      - --out
      - /tmp/replay.json
      - --model-dir
      - /tmp/model
    environment:
      PROGNOS_SERVICE: replay
      PROGNOS_API_TOKEN: "${PROGNOS_API_TOKEN:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # The replay trains its own copy to report calibration; that run is not one to
      # register, so it goes to a store that dies with the container.
      MLFLOW_TRACKING_URI: sqlite:////tmp/mlflow.db
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./results:/app/results:ro
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Training the calibration copy comes first, and the server starts after it.
      start_period: 600s
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Mounted read-only and created by the operator, not committed. The token file is
      # gitignored; `docs/runbook.md` has the one-line command that makes it. A missing
      # file fails the mount loudly, which is better than Prometheus silently scraping
      # nothing and every target reading DOWN.
      - ./ops/prometheus-token.txt:/etc/prometheus/token:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  # Trace backend. The services export OpenTelemetry spans to it over OTLP/HTTP, and
  # Grafana reads it as a datasource. In-memory storage: traces are for diagnosing
  # what is happening now, and the committed result files are the record.
  jaeger:
    # 2.20.0, not the newer 2.21.0: 2.21.0 serves only the v3 query API, and Grafana's
    # Jaeger datasource calls the v1 /api/services, so with it the traces panel failed
    # its health check. Found by running the stack.
    image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0@sha256:11c2e6c7993917ea89292b942e3428f73907b2809d554154bfb8b4ceb2301cc8
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-prognos-local-only}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, jaeger]
    restart: unless-stopped

# Resource ceilings. The Always Free target is 2 OCPU / 12 GB, so the sum of these
# limits is the thing that has to fit. Set deliberately rather than inherited.
x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 1G
