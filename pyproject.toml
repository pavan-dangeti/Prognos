[project]
name = "prognos"
version = "0.1.0"
description = "Remaining useful life prediction for turbofan engines, with calibrated intervals and cost-based maintenance decisions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py==3.16.0",
    "lightgbm==4.6.0",
    "numpy==2.4.1",
    "pandas==3.0.1",
    "pyarrow==26.0.0",
    "pydantic==2.13.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.8.0",
    "scipy==1.18.1",
    "typing-extensions==4.16.0",
]

[project.scripts]
prognos = "prognos.cli:main"

[dependency-groups]
dev = [
    "hypothesis==6.151.1",
    "mypy==1.19.1",
    "pandas-stubs==2.3.3.260113",
    "pip-audit==2.10.0",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "ruff==0.15.2",
    "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prognos"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
mypy_path = "src"
packages = ["prognos"]
# h5py, pyarrow, scipy.stats and lightgbm are installed but ship no type
# information. mypy reports that as `import-untyped`, which
# `ignore_missing_imports` does not silence, and it is reported against the
# importing module rather than the imported one, so it cannot be scoped per
# module. Silenced globally: it only concerns third-party imports, and every
# other error code stays on.
disable_error_code = ["import-untyped"]

# Untyped third-party packages. Overridden individually rather than relaxing
# mypy globally, so the rest of the codebase stays strictly checked.
[[tool.mypy.overrides]]
# Both the bare name and its submodules: a `pkg.*` pattern does not cover `pkg`
# itself, so listing only one of the two leaves errors behind.
module = [
    "h5py",
    "h5py.*",
    "pyarrow",
    "pyarrow.*",
    "sklearn",
    "sklearn.*",
    "scipy",
    "scipy.*",
    "lightgbm",
    "lightgbm.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",       # ruff-specific
    "ANN",       # annotations
    "D",         # pydocstyle
    "TID",       # tidy imports
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Test doubles implement a protocol for test purposes; annotating them fully adds
# noise without adding safety, since mypy does not check this directory.
"tests/**" = ["D100", "D101", "D102", "D103", "D107", "ANN", "B007", "RUF043"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "smoke: fast end-to-end check on a synthetic subset",
    "integration: requires converted parquet data",
]

[tool.coverage.run]
source = ["src/prognos"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
